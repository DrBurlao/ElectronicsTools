<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrBurlao's Capacitor Charge Graphics Calc</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(255, 255, 255, 0.1);
            margin: 15px auto;
            width: 95%;
            max-width: 800px;
        }
        input, select {
            background: #222;
            color: white;
            border: 1px solid #444;
            padding: 8px;
            margin: 5px;
            width: 100px;
            border-radius: 5px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            margin: 10px;
            transition: 0.3s;
        }
        button:hover {
            background: #0056b3;
        }
        canvas {
            width: 100% !important;
            height: 400px !important;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #444;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #333;
        }
        .row {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .row .container {
            width: 48%;
        }
        @media (max-width: 768px) {
            .row .container {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <h2>⚡ DrBurlao's Capacitor Charge Graphics Calc</h2>

    <div class="row">
        <div class="container">
            <h3>📏 Parámetros del Circuito</h3>
            <label>Resistencia (Ω): <input type="number" id="resistencia" value="1000"></label>
            <label>Capacitancia (F): <input type="number" id="capacitancia" value="0.001"></label>
            <label>Voltaje Inicial (V): <input type="number" id="voltajeInicial" value="0"></label>
            <label>Voltaje Final (V): <input type="number" id="voltajeFinal" value="5"></label>
            <button onclick="graficar()">📊 Graficar</button>
            <p>🕒 Constante de tiempo (τ): <span id="tauValor">0</span> s</p>
        </div>

        <div class="container">
            <h3>🎨 Personalización</h3>
            <label>Color de la Curva: <input type="color" id="colorCarga" value="#00ff00"></label>
            <label>Intervalo X: <input type="number" id="intervaloX" value="1"></label>
            <label>Intervalo Y: <input type="number" id="intervaloY" value="1"></label>
            <button onclick="graficar()">🎨 Aplicar Cambios</button>
        </div>
    </div>

    <div class="container">
        <h3>📉 Gráfica de Carga</h3>
        <canvas id="grafica"></canvas>
    </div>

    <div class="row">
        <div class="container">
            <h3>🔍 Consultar Voltaje en un Tiempo</h3>
            <label>Tiempo (s): <input type="number" id="tiempoConsulta" value="0"></label>
            <button onclick="consultarVoltaje()">🔍 Consultar</button>
            <p>⚡ Voltaje en t: <span id="voltajeTiempo">-</span> V</p>
        </div>

        <div class="container">
            <h3>📤 Exportar Datos</h3>
            <button onclick="exportarCSV()">📥 Exportar a CSV</button>
        </div>
    </div>

    <div class="container">
        <h3>📊 Datos Tabulados</h3>
        <table id="tablaDatos">
            <thead>
                <tr>
                    <th>Tiempo (s)</th>
                    <th>Voltaje (V)</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        let chart;

        function graficar() {
            const R = parseFloat(document.getElementById("resistencia").value);
            const C = parseFloat(document.getElementById("capacitancia").value);
            const V0 = parseFloat(document.getElementById("voltajeInicial").value);
            const Vf = parseFloat(document.getElementById("voltajeFinal").value);
            const tau = R * C;
            const tiempoMaximo = 6 * tau;

            document.getElementById("tauValor").textContent = tau.toFixed(4);

            let tiempos = [];
            let voltajes = [];
            const tbody = document.getElementById("tablaDatos").querySelector("tbody");
            tbody.innerHTML = "";

            for (let t = 0; t <= tiempoMaximo; t += tiempoMaximo / 50) {
                const Vt = Vf + (V0 - Vf) * Math.exp(-t / tau);
                tiempos.push(t.toFixed(4));
                voltajes.push(Vt.toFixed(4));

                let row = `<tr><td>${t.toFixed(4)}</td><td>${Vt.toFixed(4)}</td></tr>`;
                tbody.innerHTML += row;
            }

            const ctx = document.getElementById("grafica").getContext("2d");

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: "line",
                data: {
                    labels: tiempos,
                    datasets: [{
                        label: "Carga del Condensador",
                        data: voltajes,
                        borderColor: document.getElementById("colorCarga").value,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { min: 0, max: tiempoMaximo, ticks: { stepSize: parseFloat(document.getElementById("intervaloX").value) }},
                        y: { min: 0, max: Vf, ticks: { stepSize: parseFloat(document.getElementById("intervaloY").value) }}
                    }
                }
            });
        }

        function consultarVoltaje() {
            const R = parseFloat(document.getElementById("resistencia").value);
            const C = parseFloat(document.getElementById("capacitancia").value);
            const V0 = parseFloat(document.getElementById("voltajeInicial").value);
            const Vf = parseFloat(document.getElementById("voltajeFinal").value);
            const tau = R * C;
            let t = parseFloat(document.getElementById("tiempoConsulta").value);
            let Vt = Vf + (V0 - Vf) * Math.exp(-t / tau);

            document.getElementById("voltajeTiempo").textContent = Vt.toFixed(4);
        }

        function exportarCSV() {
            let csv = "Tiempo (s),Voltaje (V)\n";
            document.querySelectorAll("#tablaDatos tbody tr").forEach(row => {
                csv += row.innerText.replace(/\t/g, ",") + "\n";
            });

            const blob = new Blob([csv], { type: "text/csv" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "datos_carga.csv";
            a.click();
        }

        window.onload = graficar;
    </script>
</body>
</html>
